[project]
name = "muwon406"
version = "0.1.0"
description = "KOSPI/KOSDAQ 자동매매 시스템 (규칙기반 -> ML 고도화)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "python-telegram-bot>=21.0",
    "ta>=0.11.0",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
cloud = ["google-api-python-client>=2.100", "google-auth>=2.23"]
dashboard = ["streamlit>=1.35", "google-api-python-client>=2.100", "google-auth>=2.23"]
realtime = ["websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

[tool.poetry]
# Streamlit Community Cloud는 pyproject.toml을 Poetry로 읽어서 의존성을
# 설치한다(pip/hatchling과는 별개). Poetry는 기본적으로 프로젝트명(muwon406)과
# 같은 이름의 폴더를 패키지로 찾는데, 우리는 src/muwon 레이아웃(패키지명이
# muwon으로 다름)을 쓰므로 못 찾아서 실패했다 — package-mode = false로
# 꺼봤더니 이번엔 Poetry가 [project.dependencies]까지 안 읽어서 pandas·
# cryptography 같은 실제 의존성이 하나도 안 깔리는 부작용이 났다. 정답은
# 패키지 위치를 직접 알려주는 것 — hatchling 쪽(tool.hatch.build.targets.wheel)과
# 동일한 경로를 Poetry에도 알려준다.
packages = [{ include = "muwon", from = "src" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muwon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

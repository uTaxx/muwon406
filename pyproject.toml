[project]
name = "muwon406"
version = "0.1.0"
description = "KOSPI/KOSDAQ 자동매매 시스템 (규칙기반 -> ML 고도화)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "python-telegram-bot>=21.0",
    "ta>=0.11.0",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
cloud = ["google-api-python-client>=2.100", "google-auth>=2.23"]
dashboard = ["streamlit>=1.35", "google-api-python-client>=2.100", "google-auth>=2.23"]
realtime = ["websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

# [tool.poetry] 섹션을 두지 않는다 — Streamlit Community Cloud가 이
# pyproject.toml을 Poetry로 읽는데, 이 섹션이 있으면 (클라우드 쪽 Poetry
# 버전에서) 위 [project] dependencies를 아예 안 읽어 pandas·cryptography가
# 하나도 설치되지 않는 걸 실제 배포 로그로 확인했다. 클라우드 배포는
# requirements.txt로 처리한다.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muwon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project]
name = "muwon406"
version = "0.1.0"
description = "KOSPI/KOSDAQ 자동매매 시스템 (규칙기반 -> ML 고도화)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "python-telegram-bot>=21.0",
    "ta>=0.11.0",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
cloud = ["google-api-python-client>=2.100", "google-auth>=2.23"]
dashboard = ["streamlit>=1.35", "google-api-python-client>=2.100", "google-auth>=2.23"]
realtime = ["websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

[tool.poetry]
# Streamlit Community Cloud는 pyproject.toml을 Poetry로 읽어서 의존성을
# 설치한다(pip/hatchling과는 별개). scripts/, dashboard/app.py는 muwon406을
# 설치된 패키지로 쓰지 않고 sys.path에 src/를 직접 끼워 넣어 쓰므로, Poetry가
# "이 프로젝트 자체"까지 패키지로 설치하려 들 필요가 없다 — 그러다 우리
# src/muwon 레이아웃(프로젝트명 muwon406과 패키지명 muwon이 다름)을 못 찾아
# 설치가 실패했다. package-mode = false로 의존성 설치만 하게 한다.
package-mode = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muwon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

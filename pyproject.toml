[project]
name = "muwon406"
version = "0.1.0"
description = "KOSPI/KOSDAQ 자동매매 시스템 (규칙기반 -> ML 고도화)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "APScheduler>=3.10",
    "python-telegram-bot>=21.0",
    "ta>=0.11.0",
    "loguru>=0.7",
    "cryptography>=42.0",
]

[project.optional-dependencies]
backtest = ["vectorbt>=0.26"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3"]
cloud = ["google-api-python-client>=2.100", "google-auth>=2.23"]
dashboard = ["streamlit>=1.35", "muwon406[cloud]"]
realtime = ["websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muwon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

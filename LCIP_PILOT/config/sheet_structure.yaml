# LCIP Pilot — Google Sheets 탭/컬럼 구조
# 채택 기준: 03_BUILD_SPECIFICATION.md TASK-006 (11개 탭)
# 컬럼 상세는 schemas/google_sheets_columns.json 참고.
# status: confirmed = Blueprint/Build Spec에 문서화된 컬럼
# status: draft     = 문서 간 정의가 없어 이번 라운드에서 초안 작성 (사용자 확인 필요)

master_spreadsheet_id_env: GOOGLE_SHEETS_MASTER_SPREADSHEET_ID

tabs:
  - name: CONFIG_MASTER
    status: confirmed
    freeze_rows: 1
  - name: TOPIC_CONFIG
    status: confirmed
    freeze_rows: 1
  - name: SOURCE_REGISTRY
    status: confirmed
    freeze_rows: 1
  - name: ARTICLE_DB
    status: confirmed
    freeze_rows: 1
  - name: INTELLIGENCE_DB
    status: confirmed
    freeze_rows: 1
  - name: SOURCE_HEALTH
    status: confirmed
    freeze_rows: 1
  - name: COST_LOG
    status: confirmed
    freeze_rows: 1
  - name: SENT_HISTORY
    status: draft
    freeze_rows: 1
  - name: ERROR_LOG
    status: draft
    freeze_rows: 1
  - name: CHANGE_REQUEST
    status: draft
    freeze_rows: 1
  - name: CHANGE_LOG
    status: draft
    freeze_rows: 1

# 기존 Spreadsheet ID가 있을 경우 create_google_sheets.py는
# 이미 존재하는 탭은 건너뛰고 누락분만 생성한다 (기존 데이터 삭제 금지).

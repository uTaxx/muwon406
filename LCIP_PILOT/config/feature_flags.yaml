# LCIP Pilot — Feature Flags
# Architect Review Round 6 신설.
#
# 개별 Provider/Adapter/Storage 생성자의 `enabled=True` 인자보다 상위에 있는 전역
# 안전장치다 — "다음 Architect 승인 전까지는 실제 외부 호출을 하지 않는다"는 원칙을
# 코드 곳곳에 흩어진 기본값이 아니라 이 파일 하나로 관리한다. `enabled` 인자를 명시적으로
# 넘기지 않은 Provider/Adapter는 이 파일의 값을 기본값으로 사용한다(명시적으로 넘기면
# 그 값이 항상 우선한다 — 테스트에서 enabled=True를 직접 지정하는 경우가 이에 해당).
#
# Round 13 이어서(2026-08-08): 사용자가 "Claude API만 켜서 최소 비용으로 연결
# 검증" 옵션을 승인해 claude_api_enabled=true로 1회 전환, scripts/
# verify_claude_connection.py로 실제 연결을 확인했다(성공, 비용 $0.01 미만) —
# 검증 직후 안전 기본값(false)으로 되돌렸다. Scenario 등 자동 파이프라인이 상시
# 실제 비용을 발생시키기 시작하는 전환은 별도의 명시적 승인 없이는 하지 않는다.

feature_flags:
  # 모든 실제 네트워크 호출(RSS/API 실호출)의 총괄 스위치.
  real_network_calls: false
  # Claude API 실제 호출(ClaudeProvider._call_anthropic 실행) 스위치.
  claude_api_enabled: false
  # Google Sheets 실제 저장(GoogleSheetsStorage) 스위치.
  google_sheets_enabled: false
  # Gmail/Telegram 실제 발송(test_mode=False) 스위치.
  notification_send_enabled: false

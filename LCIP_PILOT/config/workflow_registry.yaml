# LCIP Pilot — n8n Workflow Registry
# Architect Review Q4(2026-08-05) / docs/decisions/ADR-007-n8n-workflow-consolidation.md 반영.
# 03_BUILD_SPECIFICATION.md TASK-007 원안(11개 워크플로우)은 n8n Cloud Starter 실행 횟수
# 최소화를 위해 5개로 통합되었다. 모든 워크플로우는 기본 active: false. 실제 배포/활성화는
# TASK-013 완료 후 TASK-008(자동배포 도구, 후순위화)에서 사용자 승인 후 진행한다.

workflows:
  - workflow_id: WF-P01
    file: n8n/workflows/WF-P01-master-pipeline.json
    name: LCIP - Master Pipeline
    role: Config Load -> News Collect -> Rule Filter -> AI Analyze -> Dashboard -> Notification -> Logging -> Finish (舊 WF-P01~P07 통합)
    depends_on: []
    active: false
    activation_order: 1
  - workflow_id: WF-P02
    file: n8n/workflows/WF-P02-source-health.json
    name: LCIP - Source Health
    role: Source Registry 상태 점검 (舊 WF-P08, 독립 스케줄 유지)
    depends_on: []
    active: false
    activation_order: 2
  - workflow_id: WF-P03
    file: n8n/workflows/WF-P03-cost-guard.json
    name: LCIP - Cost Guard
    role: Claude usage 집계 및 70/90/100% 단계 통제 (舊 WF-P09, Sub-workflow로 호출)
    depends_on: []
    active: false
    activation_order: 2
  - workflow_id: WF-P04
    file: n8n/workflows/WF-P04-natural-language-admin.json
    name: LCIP - Natural Language Admin
    role: 자연어 요청 -> Change Request 초안 생성 (舊 WF-P10, 관리자 수동 실행 전용 — 자동 실행 횟수에 영향 없음)
    depends_on: []
    active: false
    activation_order: 3
  - workflow_id: WF-P99
    file: n8n/workflows/WF-P99-error-handler.json
    name: LCIP - Error Handler
    role: 공통 오류 로깅/알림/민감정보 마스킹 (변경 없음)
    depends_on: []
    active: false
    activation_order: 0

# 활성화 순서 (03_BUILD_SPECIFICATION.md §22 원안을 ADR-007 구조에 맞게 축약):
# 0. WF-P99 Error Handler
# 1. WF-P01 Master Pipeline (Config Load 포함)
# 2. WF-P02 Source Health, WF-P03 Cost Guard
# 3. WF-P04 Natural Language Admin (관리자 필요 시)

# LCIP Pilot — Source Registry
# 03_BUILD_SPECIFICATION.md TASK-002/TASK-010 기준, Round 6 TASK-K03로 실사용 수준 확장.
#
# access_method: rss | api | html
# reliability_grade: A(공식/규제기관) | B(주요 언론) | C(일반 언론/블로그)
#   — 세분화된 1~5점 Source Reliability Score는 `config/source_reliability.yaml` +
#     `scripts/source_priority.py:score_for_source_type()`가 `source_type` 기준으로
#     동적으로 계산한다. 이 파일에 숫자를 다시 저장하지 않는다(중복 관리 방지,
#     Architect Review Round 6 "중복 구조 제거" 지시).
# authentication / rate_limit: Round 6 TASK-K03 신설 필드 — 실제 연동 시 필요한 인증
#   방식과 공식 문서 기준 호출 한도. 확인 안 된 값은 "TODO: source required"로 둔다.
# collection_schedule: Round 6에서 요청한 "Update Frequency"와 동일 개념이다 — 이미
#   존재하는 필드이므로 이름이 다른 중복 필드를 새로 만들지 않는다.
#
# Round 7 신설 필드 (Architect Review Round 7):
#   estimated_update_delay — 실제 사건 발생 후 이 Source에 실제로 반영되기까지 걸리는
#     시간 추정치. 공식 SLA가 없는 경우가 대부분이라 "공식 문서화된 값 없음"을 정직하게
#     표시하고, 그 대신 일반적으로 알려진 경험적 기준을 짧게 덧붙인다.
#   typical_reliability — `reliability_grade`(A/B/C 등급)를 숫자로 반복하지 않고, 그
#     등급의 근거(왜 신뢰할 만한지/무엇을 주의해야 하는지)를 사람이 읽는 문장으로
#     설명한다 — 같은 숫자를 두 번 저장하는 대신 등급에 "왜"를 붙이는 방식으로 중복을
#     피한다(Round 6 "중복 구조 제거" 원칙 유지).
#   historical_stability — 이 Pilot이 실제로 이 Source에 연결해 본 이력. 지금은
#     `feature_flags.real_network_calls`가 전부 false라 Pilot 자체 연동 이력이 전혀
#     없다 — 이것도 사실대로 "이력 없음"이라고 쓴다(임의로 안정적이라 추정하지 않는다).
#     추후 `scripts/source_health_check.py`가 실제로 이 Source를 호출하기 시작하면 그
#     결과로 이 필드를 갱신한다.
#
# 이 파일은 SOURCE_REGISTRY(Google Sheets) 초기 시드로 사용된다.

sources:
  - source_id: SRC-0001
    source_name: Google News RSS (English)
    source_type: news_rss
    endpoint_url: "https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
    access_method: rss
    language: en
    country: US
    reliability_grade: B
    collection_schedule: hourly
    expected_freshness_hours: 2
    authentication: "불필요(공개 RSS)"
    rate_limit: "공식 문서화된 제한 없음 — 과도한 호출 시 일시 차단 가능(합리적 사용 권장)"
    estimated_update_delay: "공식 SLA 없음 — 경험적으로 원문 게시 후 수분~수시간 내 반영(Google 크롤링 주기 의존)"
    typical_reliability: "중간 — Google이 색인한 언론사 원문을 그대로 재게시하지만 매체 품질이 혼재되어 원문 출처 확인이 필요하다"
    historical_stability: "Pilot 자체 연동 이력 없음(feature_flags.real_network_calls=false, 아직 실제 호출 안 함)"
    active: true


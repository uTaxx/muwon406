name: 텔레그램 (n8n이 넘겨준 것)

# n8n이 텔레그램 웹훅을 받아 여기로 넘겨준다.
#
# ## 왜 이게 필요한가
#
# 폴링(`텔레그램 명령 받기`)은 GitHub cron으로 도는데, GitHub 스케줄러는
# 몇십 분씩 늦는다. **버튼을 눌러 놓고 한참 기다리는 것은 실제로 안 쓰게
# 되는 이유가 된다.**
#
# n8n은 웹훅을 받아 즉시 부르므로 몇십 초 안에 반영된다.
#
# ## 규칙: n8n은 판단하지 않는다
#
# n8n이 하는 일은 셋뿐이다.
#   1. 텔레그램 웹훅을 받는다
#   2. "받았습니다"를 즉시 답한다 (버튼이 도는 표시로 남지 않게)
#   3. 받은 것을 그대로 여기로 넘긴다
#
# **무엇을 승인할지, 기준을 어떻게 바꿀지는 전부 여기서 정한다.** 판단이
# 두 군데로 나뉘면 나중에 왜 그렇게 됐는지 추적할 곳이 두 배가 된다.
#
# ## 폴링과 같이 못 쓴다
#
# 한 봇을 두 곳에서 받을 수 없다. n8n이 웹훅을 걸면 getUpdates는 영영
# 빈손이 된다. 그래서 이걸 켜면 `텔레그램 명령 받기`의 schedule을 꺼야
# 한다(그쪽도 웹훅을 감지하면 스스로 물러난다).

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "텔레그램 업데이트 JSON (n8n이 넣는다)"
        required: true
      dry_run:
        description: "읽기만 하고 아무것도 안 고친다"
        type: boolean
        default: false

concurrency:
  # 버튼을 연달아 누르면 여러 개가 동시에 돈다. 같은 시트 칸을 두 곳에서
  # 고치면 나중 것이 이겨야 하는데, 순서가 뒤집히면 되돌린 것이 되살아난다.
  group: telegram-n8n
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db || true
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: 텔레그램 설정 갱신
        run: |
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      # 넘어온 JSON을 셸에서 다루면 따옴표 하나에 깨진다. 파일로 받아 넘긴다.
      - name: 넘어온 것 처리
        env:
          PAYLOAD: ${{ github.event.inputs.payload }}
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/telegram_control.py --from-payload "$PAYLOAD" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # 넘겨받은 것을 처리할 때는 '어디까지 읽었나'를 안 건드리므로
      # DB에 바뀌는 것이 없다. 그래서 올리지 않는다.

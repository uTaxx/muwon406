name: KIS 모의투자 일일 자동매매

# 평일 장마감 후(15:30 KST = 06:30 UTC) 자동 실행. GitHub Actions 러너는
# 매번 새 가상머신이라 로컬 디스크가 안 남으므로, 보유 종목·가상현금
# 상태(muwon.db)를 구글드라이브에 두고 실행 시작/종료마다 내려받고
# 올린다. 설정 방법은 docs/deploy_github_actions.md 참고.

on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 구글드라이브에서 상태 DB 내려받기
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py download \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --out ./muwon.db

      - name: .env 구성
        run: |
          echo "DATABASE_URL=sqlite:///./muwon.db" >> .env
          echo "MUWON_MASTER_KEY=${{ secrets.MUWON_MASTER_KEY }}" >> .env

      - name: KIS/텔레그램 설정 갱신
        run: |
          python scripts/configure.py kis --env paper \
            --app-key "${{ secrets.KIS_APP_KEY }}" --app-secret "${{ secrets.KIS_APP_SECRET }}" \
            --account-no "${{ secrets.KIS_ACCOUNT_NO }}" --account-product-cd "01"
          python scripts/configure.py telegram \
            --bot-token "${{ secrets.TELEGRAM_BOT_TOKEN }}" --chat-id "${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: 모의투자 실행
        run: python scripts/run_paper_trading.py

      - name: 일일 전략 리뷰 (다른 전략이었다면 어땠을지 비교, 텔레그램 발송)
        run: python scripts/run_daily_review.py

      - name: 상태 DB 구글드라이브에 업로드
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
        run: |
          python scripts/gdrive_sync.py upload \
            --folder-id "${{ secrets.GDRIVE_FOLDER_ID }}" --filename muwon.db --path ./muwon.db

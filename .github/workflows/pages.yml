name: 대시보드 배포 (GitHub Pages)

# site/ 한 폴더를 그대로 GitHub Pages에 올린다.
#
# **여기 올라가는 것은 누구나 본다** — 저장소가 공개다. 그래서 site/에는
# 계좌 자료를 절대 두지 않는다. 페이지는 화면을 그리는 코드만 담고, 숫자는
# 볼 때마다 받아 온다(받아올 주소와 열쇠는 보는 사람 브라우저에만 저장된다).
#
# 스트림릿과 달리 서버가 없어서 "배포가 밀렸는데 알 방법이 없다"거나
# "DB 파일을 갈아 끼우다 연결이 죽는다" 같은 일이 원천적으로 없다.

on:
  push:
    branches: [claude/reset-lfe6ro]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다. 앞의 것을 죽이지는 않는다 — 반쯤 올라간
# 상태로 끊기면 그게 더 나쁘다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: 자료가 섞였는지 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 공개 페이지에 계좌 자료가 섞여 들어가는 사고를 여기서 막는다.
      # 사람이 실수로 스냅샷 JSON을 site/에 두면 그 순간 계좌가 공개된다.
      - name: site/에 자료 파일이 섞였는지
        run: |
          stray=$(find site -type f ! -name '*.html' ! -name '*.css' ! -name '*.js' ! -name '*.svg' ! -name '*.png' ! -name '*.ico' || true)
          if [ -n "$stray" ]; then
            echo "::error::site/ 에 화면 파일이 아닌 것이 있습니다. 이 저장소는 공개라 그대로 세상에 나갑니다:"
            echo "$stray"
            exit 1
          fi
          echo "✅ site/ 에는 화면 파일만 있습니다."

  deploy:
    name: 배포
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

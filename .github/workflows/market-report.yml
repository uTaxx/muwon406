name: 시장·섹터 리포트

# 오늘 장이 어떤 상태이고, 비슷했던 과거에는 그 뒤 무슨 일이 있었나.
#
# **아무것도 사지 않는다. 보는 것만 한다.**
#
# 평일 08:40 KST(= 23:40 UTC 전날)에 돈다. 장 시작 전에 그날 상태를
# 보기 위해서다. GitHub 스케줄러는 몇십 분씩 늦을 수 있는데, 이 작업은
# 주문을 내지 않으므로 지연에 강하다 — 나중에 승인·주문이 붙으면 그때는
# n8n이 정시에 부르게 한다(docs/설계_섹터기반.md §4.2).

on:
  schedule:
    - cron: "40 23 * * 0-4"   # 일~목 23:40 UTC = 월~금 08:40 KST
  workflow_dispatch:
    inputs:
      lens:
        description: "지표 묶음"
        type: choice
        options: ["확장", "기본"]
        default: "확장"
      horizon:
        description: "앞으로 며칠을 볼 것인가"
        default: "20"
      as_of:
        description: "이 날짜 기준으로 본다 (비우면 최신). 예: 2022-06-15"
        default: ""

concurrency:
  # 앞 실행이 느려 다음 정시를 넘기면 둘이 동시에 돈다. 시세 캐시를 둘 다
  # 쓰면 하나가 깨진다.
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -e ".[dev,cloud]"

      - name: 시세 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-market-${{ github.run_id }}
          restore-keys: |
            prices-market-
            prices-market_cap-

      - name: 리포트 작성
        run: |
          python scripts/market_report.py \
            --lens "${{ github.event.inputs.lens || '확장' }}" \
            --horizon "${{ github.event.inputs.horizon || '20' }}" \
            --as-of "${{ github.event.inputs.as_of }}" \
            --out market-report.md

      - name: 결과 아티팩트로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_number }}
          path: market-report.md
